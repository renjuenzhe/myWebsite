<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>常见文本标签练习</title>
</head>
<body>
    <h1>大</h1>
    <h2>中</h2>
    <h3>小</h3>
    <p>
        普通<b>粗</b><i>斜</i><u>下</u><s>删</s>
    </p>
    <ul>
        <li>1</li>
        <li>2</li>
        <li>3</li>
    </ul>
    <ol>
        <li>1</li>
        <li>2</li>
        <li>3</li>
    </ol>
    <table border="1">
        <tr>
            <th>标1</th>
            <th>标2</th>
            <th>标3</th>
        </tr>
        <tr>
            <td>元1,1</td>
            <td>元1,2</td>
            <td>元1,3</td>
        </tr>
        <tr>
            <td>元2,1</td>
            <td>元2,2</td>
            <td>元2,3</td>
        </tr>
        <tr>
            <td>元3,1</td>
            <td>元3,2</td>
            <td>元3,3</td>
        </tr>
    </table>
</body>
</html>
