<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS定位练习</title>
    <style>
        .box1{
            height: 350px;
            background-color: blueviolet;

        }
        .box-normal{
            width: 100px;
            height: 100px;
            background-color: yellow;
        }
        .box-relative{
            width: 100px;
            height: 100px;
            background-color: aquamarine;
            position: relative;
            left: 20px;
            top: 15px;
        }
        .box2{
            height: 350px;
            background-color: yellowgreen;
            
        }
        .box-absolute{
            width: 100px;
            height: 100px;
            background-color: aquamarine;
            position: absolute;
            left: 120px;
            
        }
        .box-fixed{
            width: 100px;
            height: 100px;
            background-color: brown;
            position: fixed;
            right: 0;
            top: 300px;
        }
    </style>
</head>
<body>
     <div>相对定位</div>
    <div class="box1">
        <div class="box-normal"></div>
        <div class="box-relative"></div>
        <div class="box-normal"></div>
    </div>
     <div>绝对定位</div>
    <div class="box2">
        <div class="box-normal"></div>
        <div class="box-absolute"></div>
        <div class="box-normal"></div>
    </div>
     <div>固定定位</div>
    <div class="box-fixed"></div>
</body>
</html>
