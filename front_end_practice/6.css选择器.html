<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS选择器练习</title>
    <style>
        /* 元素选择器 */
        h2{
            color: red;
        }
        /* 类选择器 */
        .highlight{
            background-color: yellowgreen;
        }
        /* ID选择器 */
        #header{
            font-size: larger;
            color: blue;
        }
        /* 通用选择器 */
        *{
            font-family: 'kaiti';
            font-weight: bolder;
        }
        /* 子元素选择器 */
         .father>.son{
            font-size: larger;
            color: darkcyan;
        }
        /* 后代选择器 */
        .father p{
            font-size: larger;
            color: aquamarine;
        }
        /* 相邻元素选择器 */
        h3+p{
            color: blueviolet;
        }
        /* 伪类选择器 */
        #ele:hover{
            background-color: rgb(50, 104, 205);
        /* 选第一个子元素:firstchild
            选第XX个子元素:XXth-child()
            选链接状态:active */
        }
    /* 伪元素选择器
        ::before
        ::after */
    </style>
</head>
<body>
    <h1>不同类型的css选择器</h1>
    <h2>元素选择器示例</h2>
    <h3 class="highlight">类选择器示例</h3>
    <h4 id="header">ID选择器示例</h4>
    <div class="father">
        <p class="son">子元素选择器示例</p>
        <div>
            <p class="grandson">后代选择器示例</p>
        </div>
    </div>
    <p>NPC1</p>
    <h3>相邻选择器示例</h3>
    <p>NPC2</p>
    <h4 id="ele">伪类选择器示例</h4>
</body>
</html>
