<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css常用属性</title>
    <style>
        .block{
            background-color: blue;
            width: 150px;
            height: 100px;
        }
        .inline{
            background-color: brown;
        }
        .inline-block{
            width: 100px;
        }
        .div-inline{
            display: inline; 
            background-color: aquamarine;
        }
        .span-inlineblock{
            display: inline-block;
             width: 150px;
            height: 100px;
        }
    </style>
</head>
<body>
    <h1 style="font: bolder  50px 'KaiTi';">font复合属性示例</h1>
    <p style="line-height: 40px;">这是一段长文本这是一段长文本这是一段长文本这是一段长文本这是一段长文本这是一段长文本这是一段长文本这是一段长文本这是一段长文本这是一段长文本这是一段长文本</p>
    <div class="block">块元素</div>
    <span class="inline">行内元素</span>
    <img src="动图.gif" alt="" class="inline-block">
    <h2>display</h2>
    <div class="div-inline">div转行内</div>
    <br>
    <span style="background-color: rgb(227, 127, 255);" class="span-inlineblock">span转行内块</span>
</body>
</html>
