<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css浮动练习</title>
    <style>
        .father{
            background-color: rgb(101, 165, 42);
            overflow: hidden;
            border:10px solid brown;
        }
        .leftson{
            float: left;
            height: 100px;
            width: 100px;
            background-color: yellow;
        }
        .rightson{
            float: right;
            height: 100px;
            width: 100px;
            background-color: blueviolet;
        }
    </style>
</head>
<body>
    <div class="father">
        <div class="leftson">左浮</div>
        <div class="rightson">右浮</div>
    </div>
</body>
</html>
